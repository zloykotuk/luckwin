services:
  db:
    image: postgres:18
    restart: unless-stopped
    container_name: nuxgame-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - nuxgame-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    container_name: nuxgame-app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www
    networks:
      - nuxgame-network

  nginx:
    image: nginx:alpine
    container_name: nuxgame-nginx
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
    depends_on:
      - app
    networks:
      - nuxgame-network

volumes:
  db_data:
    driver: local

networks:
  nuxgame-network:
    driver: bridge
