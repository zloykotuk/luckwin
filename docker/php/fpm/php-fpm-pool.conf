[www]
user = appuser
group = appuser

listen = 9000
listen.owner = appuser
listen.group = appgroup

access.format = "{\"type\":\"fpm\",\"ip\":\"%{REMOTE_ADDR}e\",\"forwarded_for\":\"%{HTTP_X_FORWARDED_FOR}e\",\"method\":\"%m\",\"uri\":\"%r%Q%q\",\"script\":\"%s\",\"status\":%s,\"memory\":%{bytes}M,\"duration\":%{seconds}d}"

clear_env = no
